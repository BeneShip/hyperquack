[package]
name = "hyperquack"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "HyperQuack: hyper-tenancy utilities for MotherDuck"

[[bin]]
name = "hq"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
bon = "3.7.2"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
console = "0.16.2"
duckdb = { version = "1.10502.0" }
flume = "0.12.0"
globset = "0.4.18"
indicatif = "0.18.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
suggest = "0.5.1"
time = { version = "0.3.47", features = ["parsing", "formatting", "serde"] }
tokio = { version = "1", features = ["full"] }
ureq = { version = "3.3.0", features = ["json"] }
url = "2.5.8"
urlencoding = "2.1.3"
uuid = { version = "1.23.0", features = ["serde"] }


